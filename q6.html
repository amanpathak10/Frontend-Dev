<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Q6 - Blog Layout</title>
  <link rel="stylesheet" href="q6.css"/>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <h1>My Blog</h1>
      <nav><a href="#">Home</a> <a href="#">About</a> <a href="#">Contact</a></nav>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Categories</h3>
        <ul>
          <li>Design</li>
          <li>Development</li>
          <li>Tutorials</li>
        </ul>
      </aside>

      <main class="posts">
        <article class="post">
          <h2>Post One</h2>
          <p>Intro content for the first post. Short preview text...</p>
        </article>
        <article class="post">
          <h2>Post Two</h2>
          <p>Intro content for the second post. Short preview text...</p>
        </article>
      </main>
    </div>

    <footer class="site-footer">Contact: email@example.com</footer>
  </div>
</body>
</html>
