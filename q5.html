<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Q5 - Pricing</title>
  <link rel="stylesheet" href="q5.css"/>
</head>
<body>
  <main class="pricing">
    <h1>Pricing Plans</h1>
    <section class="cards">
      <article class="card"> 
        <h2>Basic</h2>
        <p class="price">₹199</p>
        <ul>
          <li>Feature A</li>
          <li>Feature B</li>
        </ul>
      </article>

      <article class="card featured">
        <h2>Pro</h2>
        <p class="price">₹499</p>
        <ul>
          <li>All Basic features</li>
          <li>Feature C</li>
        </ul>
      </article>

      <article class="card">
        <h2>Enterprise</h2>
        <p class="price">₹999</p>
        <ul>
          <li>Everything</li>
          <li>Support</li>
        </ul>
      </article>
    </section>
  </main>
</body>
</html>
