<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Showcase Gallery</h1>
        <p>Hover over images to see the effect</p>
    </header>
    
    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/3498db/ffffff?text=Mountain+Vista" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Vista</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/e74c3c/ffffff?text=Ocean+Sunset" alt="Ocean at sunset">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean Sunset</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/2ecc71/ffffff?text=Forest+Path" alt="Forest trail">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Path</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/f39c12/ffffff?text=Desert+Dunes" alt="Desert landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Desert Dunes</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/9b59b6/ffffff?text=City+Lights" alt="City at night">
                    <div class="overlay"></div>
                </div>
                <figcaption>City Lights</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/400x300/1abc9c/ffffff?text=Lake+Reflection" alt="Lake with reflection">
                    <div class="overlay"></div>
                </div>
                <figcaption>Lake Reflection</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Image Showcase | Responsive Grid Layout</p>
    </footer>
</body>
</html>
