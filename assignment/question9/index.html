<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Outline and Focus Styling Form</h1>
        <p>Click on form elements to see focus effects</p>
    </header>
    
    <main>
        <section class="form-container">
            <form>
                <h2>Contact Information Form</h2>
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" class="input-solid" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" class="input-dashed" placeholder="your.email@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" class="input-dotted" placeholder="+1 (555) 123-4567">
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" class="input-double" placeholder="What is this about?">
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" class="textarea-groove" rows="6" placeholder="Type your message here..."></textarea>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="submit-btn">Send Message</button>
                </div>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Outline and Focus Demonstration</p>
    </footer>
</body>
</html>
