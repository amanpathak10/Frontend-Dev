<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the icons and text below to see tooltips</p>
    </header>
    
    <main>
        <section class="tooltip-container">
            <!-- Tooltip Example 1 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">📧</span>
                <span class="tooltip">Email: contact@example.com</span>
            </div>

            <!-- Tooltip Example 2 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">📞</span>
                <span class="tooltip">Call us: +1 234 567 890</span>
            </div>

            <!-- Tooltip Example 3 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">🏠</span>
                <span class="tooltip">Address: 123 Main Street</span>
            </div>

            <!-- Tooltip Example 4 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">ℹ️</span>
                <span class="tooltip">Click for more information</span>
            </div>

            <!-- Tooltip Example 5 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">⚙️</span>
                <span class="tooltip">Settings and Configuration</span>
            </div>

            <!-- Tooltip Example 6 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">❓</span>
                <span class="tooltip">Need help? Visit our FAQ</span>
            </div>
        </section>
    </main>

    <footer>
        <p>Tooltip Practice | Pure CSS Implementation</p>
    </footer>
</body>
</html>
