<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <div class="logo">MyApp</div>
        <nav class="navigation">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    
    <main class="main-content">
        <div class="content-card">
            <div class="card-header">
                <h1>Welcome to Our Platform</h1>
                <p>Fill out the form below to get started</p>
            </div>

            <div class="card-body">
                <!-- Form Section -->
                <form class="user-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="Your message here..."></textarea>
                    </div>

                    <!-- Checkbox -->
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms">
                            <span>I agree to the terms and conditions</span>
                        </label>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>

                <!-- Image Section -->
                <div class="image-section">
                    <img src="https://via.placeholder.com/300x200/3498db/ffffff?text=Featured+Image" alt="Featured content">
                    <p class="image-caption">Discover amazing features</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <p>&copy; 2025 MyApp. All rights reserved.</p>
        <div class="footer-links">
            <a href="#privacy">Privacy Policy</a>
            <a href="#terms">Terms of Service</a>
            <a href="#support">Support</a>
        </div>
    </footer>
</body>
</html>
